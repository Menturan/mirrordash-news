[project]
name = "mirrordash-news"
version = "0.1.0"
description = "Fetches and displays news headlines and preambles from configurable RSS/Atom feeds."
authors = [
    { name = "MirrorDash Developer" }
]
dependencies = [
    "jinja2"
]

[project.entry-points."mirrordash.modules"]
mirrordash_news = "mirrordash_news.plugin:NewsModule"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mirrordash_news"]
