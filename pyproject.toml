[project]
name = "mirrordash-news"
version = "1.0.1"
description = "Fetches and displays news headlines and preambles from configurable RSS/Atom feeds."
requires-python = ">=3.14"
authors = [
    { name = "MirrorDash Developer" }
]
# The mirror provides the rest (rendering, fetch_json, translations); add only what plugin.py imports
dependencies = []

[project.entry-points."mirrordash.modules"]
mirrordash_news = "mirrordash_news.plugin:NewsModule"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mirrordash_news"]
