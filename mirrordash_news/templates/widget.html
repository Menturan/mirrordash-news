<div class="news-container">
    {% if not error or items %}
        <h2 class="module-header">{{ translations.get("title", "Latest News") }}</h2>
    {% endif %}
    
    <div class="news-body">
        {% if error %}
            <div class="news-error">
                <i data-lucide="alert-circle" class="news-error-icon"></i>
                <span>{{ error }}</span>
            </div>
        {% endif %}
        
        {% if items %}
            <div class="news-items">
                {% for item in items %}
                    <div class="news-item">
                        <div class="news-meta">
                            <span class="news-source">{{ item.source }}</span>
                        </div>
                        <div class="news-headline">{{ item.title }}</div>
                        {% if show_preamble and item.preamble %}
                            <div class="news-preamble">{{ item.preamble }}</div>
                        {% endif %}
                    </div>
                {% endfor %}
            </div>
        {% endif %}
    </div>
</div>

<style>
.news-container {
    display: flex;
    flex-direction: column;
    width: 100%;
    max-width: 420px;
    color: var(--color-standard-gray, #999999);
    font-family: var(--mirror-font-family, sans-serif);
}

/* Snapping alignment based on mirror region containers */
#top_right .news-container,
#middle_right .news-container,
#bottom_right .news-container {
    align-items: flex-end;
    text-align: right;
}

#top_left .news-container,
#middle_left .news-container,
#bottom_left .news-container {
    align-items: flex-start;
    text-align: left;
}

#top_center .news-container,
#middle_center .news-container,
#bottom_center .news-container {
    align-items: center;
    text-align: center;
}

.news-body {
    width: 100%;
    margin-top: 8px;
}

.news-items {
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.news-item {
    display: flex;
    flex-direction: column;
    width: 100%;
    animation: newsFadeIn 0.5s ease-out;
}

.news-meta {
    display: flex;
    width: 100%;
}

#top_right .news-meta,
#middle_right .news-meta,
#bottom_right .news-meta {
    justify-content: flex-end;
}

#top_left .news-meta,
#middle_left .news-meta,
#bottom_left .news-meta {
    justify-content: flex-start;
}

#top_center .news-meta,
#middle_center .news-meta,
#bottom_center .news-meta {
    justify-content: center;
}

.news-source {
    font-size: 11px;
    font-weight: 600;
    color: var(--color-dimmed-charcoal, #666666);
    text-transform: uppercase;
    letter-spacing: 0.1em;
}

.news-headline {
    font-size: 15px;
    font-weight: 500;
    line-height: 1.35;
    color: var(--color-high-contrast, #ffffff);
    margin-top: 2px;
    word-break: break-word;
}

.news-preamble {
    font-size: 13px;
    font-weight: 300;
    line-height: 1.4;
    color: var(--color-standard-gray, #999999);
    margin-top: 4px;
    word-break: break-word;
    
    /* Responsive multi-line truncation (3 lines maximum) */
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
    text-overflow: ellipsis;
}

.news-error {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--color-error, #ffb4ab);
    font-size: 13px;
    padding: 8px 0;
}

.news-error-icon {
    width: 16px;
    height: 16px;
    stroke-width: 1.5px;
    flex-shrink: 0;
}

@keyframes newsFadeIn {
    from { opacity: 0; transform: translateY(2px); }
    to { opacity: 1; transform: translateY(0); }
}
</style>
